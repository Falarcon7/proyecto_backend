<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <style>
        /* Un poco de estilo para que no se vea tan básico */
        table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>Mis Productos en Inventario</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody id="tabla-productos">
            <!-- Aquí JavaScript inyectará los datos -->
        </tbody>
    </table>

    <script>
        // Esta es la parte de lógica que conecta el HTML con tu API
        async function cargarProductos() {
            // 1. Llamamos a nuestra API que creamos en Express
            const respuesta = await fetch('http://localhost:3000/productos');
            const productos = await respuesta.json();

            // 2. Buscamos donde queremos poner los datos
            const cuerpoTabla = document.getElementById('tabla-productos');

            // 3. Recorremos los productos y los pintamos en el HTML
            productos.forEach(p => {
                const fila = `<tr>
                    <td>${p.id}</td>
                    <td>${p.nombre}</td>
                    <td>$${p.precio}</td>
                    <td>${p.stock}</td>
                </tr>`;
                cuerpoTabla.innerHTML += fila;
            });
        }

        // Llamamos a la función al cargar la página
        cargarProductos();
    </script>
</body>
</html>
